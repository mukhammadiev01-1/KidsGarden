services:
  kidsgarden-api:
    build:
      context: .
      # Build on the host network so registry traffic can use IPv6. The default
      # bridge is IPv4-only, and in production Cloudflare's KUL edge (reached over
      # IPv4) stalled two @next/swc tarballs at ~20 KB/s while the SIN edge (IPv6)
      # served them at 70 MB/s. Only affects image builds, not running containers.
      network: host
    container_name: kidsgarden-api
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: production
      PORT_API: ${PORT_API:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:7007,http://localhost:7007}
    # Bound to loopback: nginx proxies to 127.0.0.1, so nothing external needs these.
    # Previously published on 0.0.0.0, which served the whole app over plain HTTP on
    # this port, bypassing TLS. UFW could not close it -- Docker writes its own
    # iptables rules that bypass ufw -- so the bind address is the actual fix.
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - ./uploads:/usr/src/app/uploads
    networks:
      - kidsgarden-network

  kidsgarden-client:
    build:
      context: ../KidsGarden-client
      # Build on the host network so registry traffic can use IPv6. The default
      # bridge is IPv4-only, and in production Cloudflare's KUL edge (reached over
      # IPv4) stalled two @next/swc tarballs at ~20 KB/s while the SIN edge (IPv6)
      # served them at 70 MB/s. Only affects image builds, not running containers.
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:3000}
        NEXT_PUBLIC_API_GRAPHQL_URL: ${NEXT_PUBLIC_API_GRAPHQL_URL:-http://127.0.0.1:3000/graphql}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://127.0.0.1:7007}
        NEXT_PUBLIC_NAVER_MAPS_KEY_ID: ${NEXT_PUBLIC_NAVER_MAPS_KEY_ID:-}
        NEXT_PUBLIC_KAKAO_MAP_JS_KEY: ${NEXT_PUBLIC_KAKAO_MAP_JS_KEY:-}
        NEXT_PUBLIC_KAKAO_REST_API_KEY: ${NEXT_PUBLIC_KAKAO_REST_API_KEY:-}
        NEXT_PUBLIC_KAKAO_REDIRECT_URI: ${NEXT_PUBLIC_KAKAO_REDIRECT_URI:-}
        NEXT_PUBLIC_TELEGRAM_BOT_NAME: ${NEXT_PUBLIC_TELEGRAM_BOT_NAME:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: kidsgarden-client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:3000}
      NEXT_PUBLIC_API_GRAPHQL_URL: ${NEXT_PUBLIC_API_GRAPHQL_URL:-http://127.0.0.1:3000/graphql}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://127.0.0.1:7007}
      NEXT_PUBLIC_NAVER_MAPS_KEY_ID: ${NEXT_PUBLIC_NAVER_MAPS_KEY_ID:-}
      NEXT_PUBLIC_KAKAO_MAP_JS_KEY: ${NEXT_PUBLIC_KAKAO_MAP_JS_KEY:-}
      NEXT_PUBLIC_KAKAO_REST_API_KEY: ${NEXT_PUBLIC_KAKAO_REST_API_KEY:-}
      NEXT_PUBLIC_KAKAO_REDIRECT_URI: ${NEXT_PUBLIC_KAKAO_REDIRECT_URI:-}
      NEXT_PUBLIC_TELEGRAM_BOT_NAME: ${NEXT_PUBLIC_TELEGRAM_BOT_NAME:-}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    # Bound to loopback: nginx proxies to 127.0.0.1, so nothing external needs these.
    # Previously published on 0.0.0.0, which served the whole app over plain HTTP on
    # this port, bypassing TLS. UFW could not close it -- Docker writes its own
    # iptables rules that bypass ufw -- so the bind address is the actual fix.
    ports:
      - "127.0.0.1:${CLIENT_PORT:-7007}:3000"
    depends_on:
      - kidsgarden-api
    networks:
      - kidsgarden-network

networks:
  kidsgarden-network:
    driver: bridge
